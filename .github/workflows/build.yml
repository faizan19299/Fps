name: Build FPS Locker mod

# Save this whole file as .github/workflows/build.yml in your GitHub repo.
# GitHub then builds the mod by itself (about 5 minutes). The finished .jar appears
# under "Releases" and also under the run's "Artifacts". Re-run it from the Actions tab.

on:
  push:
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check this file was pasted completely
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/repo
          WF="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}"
          WF="${WF%%@*}"
          if ! grep -q '^# END''_OF_FPSLOCKER_FILE$' "/tmp/repo/$WF"; then
            echo "::error::The end of build.yml is missing, so it was pasted incompletely. Copy the whole file and paste it again."
            exit 1
          fi
          echo "build.yml is complete"

      - name: Unpack the mod files
