          echo "640e6f69588a97e21311ec6d5ac081ab86e70e0b366977dc960325415185533b  /tmp/mod.tgz" | sha256sum -c -
          mkdir mod
          tar -xzf /tmp/mod.tgz -C mod
          ls -R mod/src

      - name: Set up Java 25 and Gradle 9.5.1
        run: |
          set -e
          if [ -n "$JAVA_HOME_25_X64" ] && [ -x "$JAVA_HOME_25_X64/bin/java" ]; then
            JDK="$JAVA_HOME_25_X64"
          else
            curl -fsSL -o /tmp/jdk.tgz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
            sudo mkdir -p /opt/jdk25
            sudo tar -xzf /tmp/jdk.tgz -C /opt/jdk25 --strip-components=1
            JDK=/opt/jdk25
          fi
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.5.1-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "JAVA_HOME=$JDK" >> "$GITHUB_ENV"
          echo "$JDK/bin" >> "$GITHUB_PATH"
          echo "/opt/gradle-9.5.1/bin" >> "$GITHUB_PATH"

      - name: Build the mod
        working-directory: mod
        run: |
          java -version
          gradle build --no-daemon --stacktrace

      - name: Show the built files
        run: ls -la mod/build/libs

      - name: Publish the .jar as a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          JAR=$(ls mod/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          TAG="build-${GITHUB_RUN_NUMBER}"
          NOTES="Put this .jar in your mods folder. It needs Fabric API for 26.2. Install Mod Menu too, to get the settings button."
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "FPS Locker build ${GITHUB_RUN_NUMBER}" --notes "$NOTES" || gh release upload "$TAG" "$JAR" --clobber

      - name: Also keep the .jar as a download on this run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fpslocker-jar
          path: mod/build/libs/*.jar

